spring.application.name=backend

# --- Base de datos (PostgreSQL) ---
# Cada valor se puede sobrescribir con una variable de entorno; si no existe, se usa el valor de después de los dos puntos
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/nutriapp}
spring.datasource.username=${DB_USER:nutri}
spring.datasource.password=${DB_PASSWORD:nutri_dev_password}

# --- JPA / Hibernate ---
# validate: Hibernate solo comprueba que las entidades coincidan con las tablas; NO las crea ni las modifica
spring.jpa.hibernate.ddl-auto=validate
# Evita que se mantenga abierta la conexión a la base durante toda la petición web
spring.jpa.open-in-view=false

# --- Flyway ---
# Aplica al arrancar los scripts de src/main/resources/db/migration
spring.flyway.enabled=true
